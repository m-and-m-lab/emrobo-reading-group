<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {%- assign target = page.redirect_to | relative_url %}
  <title>Moved · {{ site.title }}</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <script>location.replace("{{ target }}" + location.hash);</script>
</head>
<body>
  <p>This page moved to <a href="{{ target }}">{{ page.redirect_to | absolute_url }}</a>.</p>
</body>
</html>
