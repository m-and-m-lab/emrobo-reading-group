---
layout: default
---
<div class="wrap page-end">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {%- endif %}
    {%- if page.toc %}
    <nav class="jump" aria-label="On this page">
      <b>On this page</b>
      {%- for item in page.toc %}
      <a href="#{{ item.id }}">{{ item.label }}</a>
      {%- endfor %}
    </nav>
    {%- endif %}
  </header>
  {{ content }}
</div>
