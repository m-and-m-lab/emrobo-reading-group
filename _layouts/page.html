---
layout: default
---
<header class="page-head">
  <div class="container page-head__inner">
    {%- if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {%- endif %}
    <h1 class="page-head__title">{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="page-head__lede">{{ page.lede }}</p>
    {%- endif %}
  </div>
</header>
<div class="container page-body{% if page.toc %} page-body--toc{% endif %}">
  {%- if page.toc %}
  {% include toc.html items=page.toc %}
  {%- endif %}
  <div class="page-content">
    {{ content }}
  </div>
</div>
