# ---------------------------------------------------------------------------
# Embodiment Reading Group — site settings
# Most day-to-day edits happen in _data/sessions.yml, not here.
# Changes to this file need a fresh `jekyll serve` locally (GitHub rebuilds on push).
# ---------------------------------------------------------------------------

title: Embodiment Reading Group
description: >-
  A research reading group at the University of Michigan on how representations
  of a robot's body and physical constraints (morphology, kinematics, dynamics,
  contact, sensing, actuation limits) unlock capabilities for planning, control
  and transferable skills, with a focus on mobile and dexterous manipulation.

# Project site under the m-and-m-lab organization.
# If the repo is renamed, update `baseurl` to "/<new-repo-name>".
url: "https://m-and-m-lab.github.io"
baseurl: "/emrobo-reading-group"
timezone: America/Detroit

# Shown as the label for the current schedule. Upcoming sessions (any semester)
# are listed on /sessions/; past ones move to the session log automatically.
current_semester: "Fall 2026"

meeting:
  day: "Fridays"
  day_note: "Tentative"      # shown next to the day; set to "" once confirmed
  start_time: ""            # 24h local time, e.g. "16:00". Leave empty while TBD.
  length: "60–90 min"
  cadence: "Weekly or biweekly"
  duration: 90              # minutes, used for calendar entries
  tooling_duration: 120     # minutes, monthly Tooling Hour
  tz_label: "ET"
  location: "FRB meeting room"
  location_note: "Room TBD · Ford Motor Company Robotics Building"
  location_url: "https://www.google.com/maps/search/?api=1&query=Ford+Motor+Company+Robotics+Building+Ann+Arbor"
  snacks: "Maybe"

links:
  # Online meeting. Public Zoom links get scraped and "zoombombed", so the
  # recommended setup is: leave `zoom_join` empty and share the link through the
  # mailing list / calendar invite, or set `zoom_registration` to a signup form.
  zoom_join: ""
  zoom_registration: ""
  mailing_list: ""          # e.g. a Google Group join page
  slack: ""                 # UMich Slack channel link (shown as UMich-only)
  slack_channel: "#embodiment-reading-group"
  youtube: ""
  linkedin: ""
  presenter_signup: ""      # e.g. a Google Sheet
  suggest_paper_form: ""    # optional; GitHub issue templates are used otherwise
  contact_email: ""
  github_repo: "https://github.com/m-and-m-lab/emrobo-reading-group"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
