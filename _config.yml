# ---------------------------------------------------------------------------
# Embodiment & Skill Learning Reading Group — site settings
# Most day-to-day edits happen in _data/sessions.yml, not here.
# Changes to this file need a fresh `jekyll serve` locally (GitHub rebuilds on push).
# ---------------------------------------------------------------------------

title: "Embodiment & Skill Learning Reading Group"
description: >-
  A research reading group at the University of Michigan on how representations
  of a robot's body and physical constraints (morphology, kinematics, dynamics,
  contact, sensing, actuation limits) unlock capabilities for planning, control
  and transferable skills, with a focus on mobile and dexterous manipulation.

# Project site under the m-and-m-lab organization.
# If the repo is renamed, update `baseurl` to "/<new-repo-name>".
url: "https://m-and-m-lab.github.io"
baseurl: "/emrobo-reading-group"
timezone: America/Detroit

# Shown as the label for the current schedule. Upcoming sessions (any semester)
# are listed on /sessions/; past ones move to the session log automatically.
current_semester: "Fall 2026"
# One status line shown at the top of the home and schedule pages. Set to "" once settled.
status: "Fall 2026 pilot · schedule being finalized"

meeting:
  when: "Every other Tuesday, 4:00–5:00 PM ET"   # shown in prose on the home page
  start_time: "16:00"       # 24h local time. Leave empty ("") while TBD.
  duration: 60              # minutes, used for session times and calendar entries
  tooling_duration: 60      # minutes, Tooling Hour
  tz_label: "ET"
  location: "FRB 3320"
  address: "Ford Motor Company Robotics Building, 2505 Hayward St, Ann Arbor, MI 48109"   # used in calendar entries so apps can map it
  location_url: "https://www.google.com/maps/search/?api=1&query=Ford+Motor+Company+Robotics+Building%2C+2505+Hayward+St%2C+Ann+Arbor%2C+MI+48109"
  snacks: "Maybe"

links:
  # Online meeting (same Zoom link every session).
  zoom_url: "https://umich.zoom.us/j/92340245066"
  zoom_id: "923 4024 5066"
  zoom_phone: "+1 646 876 9923"
  mailing_list: ""          # e.g. a Google Group join page
  slack: ""                 # optional link to the channel
  slack_channel: "#emrobo-reading-group"   # private channel on the University of Michigan Slack
  youtube: ""
  linkedin: ""
  presenter_signup: ""      # e.g. a Google Sheet
  suggest_paper_form: ""    # optional; GitHub issue templates are used otherwise
  contact_email: ""
  github_repo: "https://github.com/m-and-m-lab/emrobo-reading-group"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
