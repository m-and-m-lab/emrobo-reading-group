{%- comment -%} The TaBLE lens (Task, Body, Learning, Evaluation) as a compact strip. {%- endcomment -%}
<ol class="lens-strip">
  {%- for l in site.data.lens %}
  <li>
    <span class="key" aria-hidden="true">{{ l.key }}</span>
    <div>
      <strong>{{ l.name }}</strong>
      <span>{{ l.question }}</span>
    </div>
  </li>
  {%- endfor %}
</ol>
