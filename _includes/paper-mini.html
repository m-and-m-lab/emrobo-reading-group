{%- assign p = include.paper -%}
{%- assign primary = p.links | first -%}
<li class="paper-mini">
  <a class="paper-mini__glyph" href="{{ '/papers/' | relative_url }}#{{ p.id }}" tabindex="-1" aria-hidden="true">{% include glyphs/{{ p.glyph }}.html %}</a>
  <div>
    <p class="paper-mini__short">{{ p.short }}</p>
    <h3 class="paper-mini__title"><a href="{{ primary.url }}">{{ p.title }}</a></h3>
    <p class="paper-mini__meta">{{ p.first_author }} · {{ p.venue }} · <a href="{{ '/papers/' | relative_url }}#{{ p.id }}">Lens notes</a></p>
  </div>
</li>
