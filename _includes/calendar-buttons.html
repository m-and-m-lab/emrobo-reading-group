{%- assign cal_https = '/calendar.ics' | absolute_url -%}
{%- assign cal_webcal = cal_https | replace_first: "https://", "webcal://" | replace_first: "http://", "webcal://" -%}
<ul class="inline-list">
  <li><a href="https://calendar.google.com/calendar/render?cid={{ cal_webcal | url_encode }}">Google Calendar</a></li>
  <li><a href="{{ cal_webcal }}">Apple or Outlook</a></li>
  <li><a href="{{ '/calendar.ics' | relative_url }}">Download .ics</a></li>
</ul>
