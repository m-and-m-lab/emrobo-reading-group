# Layers of Fig. 1 on the home page. `id` must match a data-layer group in
# _includes/figure-body.html (generated artwork; edit the captions freely).
- id: geometry
  label: Geometry
  caption: The links, meshes and collision shapes that a URDF or USD asset describes.
- id: graph
  label: Kinematic graph
  caption: Joints become nodes and links become edges. Body Transformer and GET-Zero build this structure into the policy itself.
- id: dynamics
  label: Dynamics
  caption: Mass, inertia and torque limits decide which motions are feasible, not only which poses can be reached.
- id: contact
  label: Contact
  caption: Foot contacts, the support polygon and the grasp all constrain whole-body motion at the same time.
- id: sensing
  label: Sensing
  caption: Where the camera sits decides what it misses. Here the gripper hides the handle from the body camera.
- id: reach
  label: Reach
  caption: The arm's workspace limit, and the manipulability ellipse at the gripper, which flattens along the arm as it nears full extension.
- id: scene
  label: Scene chain
  caption: A virtual kinematic chain joins the world, the base, the arm and the drawer's prismatic joint into one structure a planner can search over.
