# ---------------------------------------------------------------------------
# All sessions, past and future. Order does not matter; pages sort by date.
#
# Required:  date (YYYY-MM-DD), semester, type, title
# type:      paper | invited | tooling | special
# Optional:  time ("16:00", quoted, overrides _config.yml), duration (minutes),
#            location, authors, venue, paper_url, code_url, presenter,
#            presenter_url, affiliation, theme, description,
#            slides, video (YouTube URL), notes (shared notes URL),
#            extra_readings (list of {title, url}), tentative (true/false)
#
# After a session: add `slides`, `video`, and `notes`. The session is marked
# past automatically, and moves to /archive/ once `current_semester` in
# _config.yml changes.
#
# The entries below are a tentative starting point; edit or replace freely.
# ---------------------------------------------------------------------------

