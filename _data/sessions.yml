  semester: Fall 2026
  type: tooling
  tentative: true
  title: From the Spot USD asset to a mobile manipulation policy in Isaac Lab
  presenter: TBD
  description: >-
    A hands-on walkthrough of the Spot USD asset and an Isaac Sim / Isaac Lab
    training pipeline for mobile manipulation: where the robot's structure,
    physical properties and control interface live, and what breaks on the way
    to a policy.

