  title: "Kickoff: what should a robot know about its own body?"
  presenter: Aparajito Saha and Zhen Hao Gan
  description: >-
    Scope and format, the TaBLE lens (Task, Body, Learning, Evaluation) we'll use to compare papers, a tour of
    the starting reading list, and presenter sign-ups for the first sessions.

