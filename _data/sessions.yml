# ---------------------------------------------------------------------------
# All sessions, past and future. Order does not matter; pages sort by date.
#
# Required:  date (YYYY-MM-DD), semester, type, title
# type:      paper | invited | tooling | special
# Optional:  time ("16:00", quoted, overrides _config.yml), duration (minutes),
#            location, authors, venue, paper_url, code_url, presenter,
#            presenter_url, affiliation, theme, description, abstract,
#            slides, video (YouTube URL), notes (shared notes URL),
#            extra_readings (list of {title, url}, shown as "Paired with"),
#            tentative (true/false)
#
# Upcoming sessions show on the home page and /sessions/. Once the date has
# passed they move to the session log (Date | Title | Abstract | Presenter |
# Notes | Recording / resources); add `abstract`, `slides`, `video` and `notes`.
#
# The entries below are a tentative plan built from the proposal's reading
# list (Fridays, starting October 2026). Edit or replace freely.
# ---------------------------------------------------------------------------

