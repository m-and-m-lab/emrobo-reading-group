      authors: Huang et al.
      venue: ICML 2020
      year: 2020
      url: https://arxiv.org/abs/2007.04976
      kind: foundational
      session: 2026-10-01-paper
    - title: "My Body is a Cage: the Role of Morphology in Graph-Based Incompatible Control"
      authors: Kurin et al.
      venue: ICLR 2021
      year: 2021
      url: https://arxiv.org/abs/2010.01856
      kind: foundational
    - title: "MetaMorph: Learning Universal Controllers with Transformers"
      authors: Gupta et al.
      venue: ICLR 2022
      year: 2022
      url: https://arxiv.org/abs/2203.11931
